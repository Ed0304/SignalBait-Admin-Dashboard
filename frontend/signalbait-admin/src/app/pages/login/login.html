<!-- Login modal -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">

        <h1 class="mb-6 text-center text-3xl font-bold text-gray-900">
            Login
        </h1>

        <form (ngSubmit)="login()" class="space-y-5">

            <div>
                <label
                    for="username"
                    class="mb-2 block text-sm font-medium text-gray-700">
                    Username
                </label>
                <!--ngModel connects an input field to a component property.-->
                <!--In this case, the username input is connected to the username property.-->
                <input
                    [(ngModel)]="username"
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3
                           outline-none transition
                           focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            </div>

            <div>
                <label
                    for="password"
                    class="mb-2 block text-sm font-medium text-gray-700">
                    Password
                </label>
                <!--ngModel connects an input field to a component property.-->
                <!--In this case, the password input is connected to the password property.-->

                <input
                    [(ngModel)]="password"
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    class="w-full rounded-lg border border-gray-300 px-4 py-3
                           outline-none transition
                           focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-blue-600 px-4 py-3
                       font-semibold text-white
                       transition hover:bg-blue-700
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Login
            </button>

        </form>
    </div>
</div>
